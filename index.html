<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>MindSpace iOS</title>
  <link rel="icon" type="image/png" href="AppIcon-1024.png">
  <style>
    :root {
      --background: #090d0c;
      --surface: #111715;
      --border: #26322e;
      --primary: #f2f7f4;
      --secondary: #96a49e;
      --accent: #8bcab7;
      --on-accent: #07110d;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--background);
      color: var(--primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 32px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
    }
    .icon { width: 88px; height: 88px; border-radius: 20px; }
    h1 { margin: 20px 0 6px; font-size: 32px; letter-spacing: -0.03em; }
    .version { color: var(--accent); font-weight: 650; }
    p { color: var(--secondary); line-height: 1.55; }
    a.button {
      display: block;
      margin-top: 12px;
      padding: 15px 18px;
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
    }
    .primary { background: var(--accent); color: var(--on-accent); }
    .secondary { border: 1px solid var(--border); color: var(--primary); }
    code {
      display: block;
      margin-top: 24px;
      padding: 14px;
      overflow-wrap: anywhere;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--secondary);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="AppIcon-1024.png" alt="MindSpace app icon">
    <h1>MindSpace</h1>
    <div class="version">v3.0.0 · build 12</div>
    <p>A private, account-free meditation app with a calm, image-free interface and offline-first playback.</p>
    <a class="button primary" href="https://github.com/vkr1729/mindspace-source/releases/download/v3.0.0/MindSpace.ipa">Download unsigned IPA</a>
    <a class="button secondary" href="sidestore://source?url=https://raw.githubusercontent.com/vkr1729/mindspace-source/main/apps.json">Add to SideStore</a>
    <code>https://raw.githubusercontent.com/vkr1729/mindspace-source/main/apps.json</code>
  </main>
</body>
</html>
